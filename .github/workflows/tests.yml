name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04  # still has Python 3.8, like macOS 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/js/engine.test.mjs
